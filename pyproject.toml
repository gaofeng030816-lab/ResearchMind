[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind"
version = "2.0.0rc1"
description = "AI-powered research reading and knowledge capture workspace"
license-files = [
    "THIRD_PARTY_NOTICES.md",
    "src/researchmind/pdf/viewer_component/LICENSE.pdfjs.txt",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.5,<4",
    "PyMuPDF>=1.28,<2",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.62,<2",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-julia>=0.23,<0.24",
]

[project.scripts]
researchmind = "researchmind.launcher:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
researchmind = [
    "pyproject.toml",
    "pdf/viewer_component/frontend/assets/**/*",
    "pdf/viewer_component/THIRD_PARTY_NOTICES.md",
    "pdf/viewer_component/LICENSE.pdfjs.txt",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
